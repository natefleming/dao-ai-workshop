# yaml-language-server: $schema=../../../dao-ai/schemas/model_config_schema.json
#
# Lab 11 - Step 3: kb_assistant (HYBRID + FlashRank rerank) -- FINAL
# ---------------------------------------------------------
# Capability adds (vs step 2):
#   - retriever.rerank: true
#     -> layers a FlashRank cross-encoder pass over the HYBRID hits.
#        Cross-encoder scores each (query, passage) pair jointly, so
#        it catches semantic nuances that the bi-encoder ANN + BM25
#        merge misses. This is the same `rerank:` field ai_search uses
#        -- lakebase_search reached parity in dao-ai 0.1.105.
#   - search_parameters.num_results: 20
#     -> widen the retrieval net so the reranker has candidates to
#        re-score. FlashRank's default `top_n` (still 5 here) trims
#        the final list back down.
#
# The rest of the config is identical to step 2.

parameters:
  username:
    description: Per-student username for unique deployment names. Auto-set by the notebook.
    # No default => required.
  lakebase_project:
    description: Lakebase project name.
    default: retail-consumer-goods
  sp_secret_scope:
    description: Databricks secret scope holding the Lakebase SP credentials.
    default: dao_ai_workshop
  sp_client_id_secret:
    description: Secret key within the scope for the SP client_id.
    default: DAO_AI_SP_CLIENT_ID
  sp_client_secret_secret:
    description: Secret key within the scope for the SP client_secret.
    default: DAO_AI_SP_CLIENT_SECRET
  schema_name:
    description: Postgres schema holding kb_articles (default `public`).
    default: public
  table_name:
    description: Postgres table with vector + tsvector columns.
    default: kb_articles
  llm_endpoint:
    description: Databricks LLM serving endpoint name.
    default: databricks-claude-sonnet-4-5
  embedding_model:
    description: Foundation-model embedding endpoint used to encode incoming queries.
    default: databricks-gte-large-en
  # NEW in step 3 (vs step 2): FlashRank cross-encoder model.
  reranker_model:
    description: FlashRank cross-encoder model.
    default: ms-marco-MiniLM-L-12-v2

variables:
  client_id: &client_id
    options:
      - scope: ${var.sp_secret_scope}
        secret: ${var.sp_client_id_secret}
      - env: DAO_AI_SP_CLIENT_ID
  client_secret: &client_secret
    options:
      - scope: ${var.sp_secret_scope}
        secret: ${var.sp_client_secret_secret}
      - env: DAO_AI_SP_CLIENT_SECRET

resources:
  models:
    default_llm: &default_llm
      name: ${var.llm_endpoint}
      temperature: 0.1
      max_tokens: 4096

  databases:
    kb_lakebase: &kb_lakebase
      project: ${var.lakebase_project}
      client_id: *client_id
      client_secret: *client_secret

retrievers:
  kb_retriever: &kb_retriever
    type: lakebase_search
    vector_store:
      database: *kb_lakebase
      schema_name: ${var.schema_name}
      table: ${var.table_name}
      content_column: passage
      embedding_column: embedding
      tsvector_column: passage_tsv
      embedding_model: ${var.embedding_model}
      metadata_columns:
        - category
        - priority
    search_parameters:
      query_type: HYBRID
      # NEW in step 3 (vs step 2): wider retrieval net for the reranker.
      num_results: 20
    # NEW in step 3 (vs step 2): FlashRank rerank pass.
    #   * `rerank: true` picks the default FlashRank model
    #     (ms-marco-MiniLM-L-12-v2). Use the explicit form below
    #     to pick a different model or a different `top_n`.
    rerank:
      model: ${var.reranker_model}
      top_n: 5

tools:
  kb_search: &kb_search
    name: kb_search
    function:
      type: lakebase_search
      retriever: *kb_retriever

agents:
  kb_assistant: &kb_assistant
    name: kb_assistant
    model: *default_llm
    tools:
      - *kb_search
    prompt: |
      You are a knowledge-base assistant. Always call `kb_search` before answering.
      Cite the article id in square brackets after each fact, e.g. [d01].

app:
  name: kb-assistant-${var.username}
  registered_model:
    name: kb_assistant_${var.username}
  agents:
    - *kb_assistant
