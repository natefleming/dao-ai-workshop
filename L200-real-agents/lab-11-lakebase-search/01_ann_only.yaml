# yaml-language-server: $schema=../../../dao-ai/schemas/model_config_schema.json
#
# Lab 11 - Step 1: kb_assistant (ANN only)
# ---------------------------------------------------------
# Capability: semantic similarity search over the passage embedding
# column using the `lakebase_ann` index. No lexical / BM25 component.
# The narrowest possible lakebase_search config -- the tsvector column
# does not even need to exist for this step.

parameters:
  username:
    description: Per-student username for unique deployment names. Auto-set by the notebook.
    # No default => required.
  lakebase_project:
    description: Lakebase project name (workspace admin creates once).
    # No default => required.
  secret_scope:
    description: Databricks secret scope holding the SP client id / secret / host.
    # No default => required.
  sp_client_id_key:
    description: Secret key under `secret_scope` holding the SP OAuth client id.
    default: SP_CLIENT_ID
  sp_client_secret_key:
    description: Secret key under `secret_scope` holding the SP OAuth client secret.
    default: SP_CLIENT_SECRET
  workspace_host_key:
    description: Secret key under `secret_scope` holding the workspace host (https://<workspace>.cloud.databricks.com).
    default: DATABRICKS_HOST
  schema_name:
    description: Postgres schema holding kb_articles (default `public`).
    default: public
  table_name:
    description: Postgres table with vector + tsvector columns.
    default: kb_articles
  llm_endpoint:
    description: Databricks LLM serving endpoint name.
    default: databricks-claude-sonnet-4-5
  embedding_model:
    description: Foundation-model embedding endpoint used to encode incoming queries. Must match the model that populated the `embedding` column at seed time.
    default: databricks-gte-large-en

# Anchored option lists -- dao-ai resolves the first entry that yields
# a value (secret scope preferred; env-var fallback for local dev).
variables:
  client_id: &client_id
    options:
      - scope: ${var.secret_scope}
        secret: ${var.sp_client_id_key}
      - env: ${var.sp_client_id_key}
  client_secret: &client_secret
    options:
      - scope: ${var.secret_scope}
        secret: ${var.sp_client_secret_key}
      - env: ${var.sp_client_secret_key}
  workspace_host: &workspace_host
    options:
      - scope: ${var.secret_scope}
        secret: ${var.workspace_host_key}
      - env: ${var.workspace_host_key}

resources:
  models:
    default_llm: &default_llm
      name: ${var.llm_endpoint}
      temperature: 0.1
      max_tokens: 4096

  databases:
    kb_lakebase: &kb_lakebase
      project: ${var.lakebase_project}
      client_id: *client_id
      client_secret: *client_secret
      workspace_host: *workspace_host

retrievers:
  kb_retriever: &kb_retriever
    type: lakebase_search
    vector_store:
      database: *kb_lakebase
      schema_name: ${var.schema_name}
      table: ${var.table_name}
      content_column: passage
      embedding_column: embedding
      embedding_model: ${var.embedding_model}
      metadata_columns:
        - category
        - priority
    search_parameters:
      query_type: ANN
      num_results: 5

tools:
  kb_search: &kb_search
    name: kb_search
    function:
      type: lakebase_search
      retriever: *kb_retriever

agents:
  kb_assistant: &kb_assistant
    name: kb_assistant
    model: *default_llm
    tools:
      - *kb_search
    prompt: |
      You are a knowledge-base assistant. Always call `kb_search` before answering.
      Cite the article id in square brackets after each fact, e.g. [d01].

app:
  name: kb-assistant-${var.username}
  registered_model:
    name: kb_assistant_${var.username}
  agents:
    - *kb_assistant
