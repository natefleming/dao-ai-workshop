# yaml-language-server: $schema=../../../dao-ai/schemas/model_config_schema.json
#
# Lab 24 - UC OTEL Trace Tables (saas_helpdesk)
# ---------------------------------------------
# Same two-tier supervisor as Lab 21/22/23. The new surface is
# ``app.trace_location``: tell dao-ai which UC schema + SQL warehouse to
# write traces to, and a single ``mlflow.set_experiment(experiment_id=...,
# trace_location=UnityCatalog(...))`` call creates three OTEL Delta tables
# in that schema and routes new traces to them.
#
# What this lab demonstrates:
#   - ``mlflow.set_experiment(trace_location=UnityCatalog(...))`` links an
#     MLflow experiment to a UC schema; the three OTEL tables
#     (``..._otel_spans``, ``..._otel_logs``, ``..._otel_metrics``) are
#     created on first trace export. This is the post-MLflow-3.11 blessed
#     API and replaces the older ``set_experiment_trace_location`` +
#     ``set_destination`` + ``UCSchemaLocation`` trio.
#   - The notebook makes the link call itself (dao-ai's runtime does this
#     automatically for Model Serving + Databricks Apps deployments inside
#     ``_link_experiment_trace_location``, but the notebook is neither, so
#     the lab calls it explicitly).
#   - The ``..._otel_spans`` Delta table is the durable, queryable surface
#     for everything you saw in Lab 23 -- once traces land in UC you can
#     join them to feedback assessments, build Lakehouse Monitoring
#     dashboards, and use Spark to slice by app version, user, or session.

parameters:
  username:
    description: Per-student username for unique deployment names. Auto-set by the notebook.
  catalog:
    description: Unity Catalog catalog for the OTEL trace tables.
    default: main
  schema:
    description: Unity Catalog schema for the OTEL trace tables.
    default: dao_ai_workshop
  warehouse_id:
    description: SQL warehouse ID. Required by ``app.trace_location`` -- the OTEL writer queries it during table provisioning.
    # No default; the notebook widget supplies this.
  llm_endpoint:
    description: Primary LLM endpoint (supervisor + escalation tier).
    default: databricks-claude-sonnet-4-5
  fast_llm_endpoint:
    description: Faster/smaller LLM endpoint for the front-line tier.
    default: databricks-claude-haiku-4-5

resources:
  models:
    default_llm: &default_llm
      name: ${var.llm_endpoint}
      temperature: 0.2
      max_tokens: 4096

    fast_llm: &fast_llm
      name: ${var.fast_llm_endpoint}
      temperature: 0.2
      max_tokens: 2048

schemas:
  workshop_schema: &workshop_schema
    catalog_name: ${var.catalog}
    schema_name: ${var.schema}

agents:
  tier1_support: &tier1_support
    name: tier1_support
    description: Front-line agent for how-to and policy questions.
    model: *fast_llm
    prompt: |
      You are tier-1 support for a SaaS product. Answer how-to and
      policy questions concisely.
    handoff_prompt: |
      How-to questions, account questions, simple policy lookups.

  tier2_engineer: &tier2_engineer
    name: tier2_engineer
    description: Technical specialist for bugs and integration issues.
    model: *default_llm
    prompt: |
      You are tier-2 technical support. Handle reported bugs, error
      messages, integration failures. Provide concrete diagnostic
      steps and reference logs or error-correlation IDs.
    handoff_prompt: |
      Technical issues: bugs, errors, integration failures.

app:
  name: trace-loc-demo-${var.username}
  description: "Workshop lab 24: UC OTEL trace tables via app.trace_location"
  log_level: INFO
  agents:
  - *tier1_support
  - *tier2_engineer
  orchestration:
    supervisor:
      model: *default_llm
      prompt: |
        Route the customer to the right specialist:
          - tier1_support  : how-to, policy lookups, account questions
          - tier2_engineer : bugs, errors, broken integrations

  # -------------------------------------------------------------------------
  # UC trace location.
  #
  # dao-ai's TraceLocationModel takes a schema reference + a warehouse_id
  # (and an optional ``table_prefix`` to namespace tables when multiple
  # agents share a schema). On Model Serving / Apps deploys, dao-ai calls
  # ``mlflow.set_experiment(trace_location=UnityCatalog(...))`` automatically
  # at startup; for in-process notebook usage, the notebook does the same
  # call explicitly.
  #
  # ``table_prefix`` is set explicitly here so the verification queries in
  # Step 5 / Step 8 / Step 9 of the notebook know the exact table names.
  # Without an explicit prefix, MLflow's default is ``mlflow_experiment_trace``
  # (NOT the experiment_id, despite older docstrings) — and if you re-run
  # the lab against a different schema than the first run, the experiment
  # stays bound to the original location and the query targets the wrong
  # path. An explicit prefix sidesteps both gotchas.
  # -------------------------------------------------------------------------
  trace_location:
    schema: *workshop_schema
    warehouse: ${var.warehouse_id}
    table_prefix: lab24_traces

  # Layer monitoring on top -- assessments now land alongside trace spans in UC.
  monitoring:
    sample_rate: 1.0
    scorers:
    - safety
    - relevance_to_query
    - tool_call_efficiency
    guidelines_sample_rate: 0.5
    guidelines:
    - name: routing_quality
      guidelines:
      - How-to and policy questions should be answered by tier1_support
      - Bug reports and HTTP error messages should route to tier2_engineer
